name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Formatting and vet
        run: make lint
      - name: Unit tests
        run: go test -race ./...

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Pull Stirling PDF image
        run: docker pull stirlingtools/stirling-pdf:3.3.0
      - name: End-to-end tests
        run: go test -tags=e2e -count=1 -timeout 15m ./e2e -v

  build:
    name: CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Build
        run: go build -o bin/stirling-pdf ./cmd/stirling-pdf
      - name: Smoke test
        run: ./bin/stirling-pdf list > /dev/null && ./bin/stirling-pdf misc compress-pdf --help > /dev/null
